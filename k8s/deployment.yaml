apiVersion: apps/v1
kind: Deployment
metadata:
  name: educationapp
  namespace: education
spec:
  replicas: 2
  selector:
    matchLabels:
      app: educationapp
  template:
    metadata:
      labels:
        app: educationapp
    spec:
      containers:
        - name: educationapp
          image: DOCKERHUB_USERNAME/educationapp:1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 35
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}

---
- name: Prepare Ubuntu Jenkins agent prerequisites
  hosts: jenkins
  become: true
  tasks:
    - name: Install Java, Git, Maven and Docker
      apt:
        name: [openjdk-17-jdk, git, maven, docker.io]
        state: present
        update_cache: true
    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: true
    - name: Add SSH user to Docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
